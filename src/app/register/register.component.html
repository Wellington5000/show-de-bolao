<div class="r-container">
  <a routerLink=""><img class="r-logo" ngSrc="/assets/images/logo-show-de-bolao.svg" alt="Logo" height="74"
                        width="66"></a>
  <div class="r-image-container">
    <img ngSrc="/assets/images/jogador-de-costas-2.svg" alt="Jogador de costas" height="730" width="1060">
  </div>
  <div class="r-form-container">
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="r-form">
      <h3 class="r-form-title">Bem vindo ao Show de Bolão</h3>
      <div class="r-form-fields">
        <div class="input-container">
          <label for="name">Nome</label>
          <div class="input-content">
            <div class="ic-icon">
              <img ngSrc="/assets/icons/person.svg" alt="Ícone de pessoa" height="17" width="15">
            </div>
            <input id="name" type="text" formControlName="name" [maxLength]="150">
          </div>
        </div>
        <div class="input-container">
          <label for="surname">Apelido</label>
          <div class="input-content">
            <div class="ic-icon">
              <img ngSrc="/assets/icons/person.svg" alt="Ícone de pessoa" height="17" width="15">
            </div>
            <input id="surname" type="text" formControlName="surname" [maxLength]="100">
          </div>
        </div>
        <div class="input-container">
          <label for="phone_number">Telefone</label>
          <div class="input-content">
            <div class="ic-icon">
              <img ngSrc="/assets/icons/phone.svg" alt="Ícone de telefone" height="20" width="20">
            </div>
            <input id="phone_number" type="text" formControlName="phone_number" mask="(00) 0 0000 0000">
          </div>
        </div>
        <div class="input-container">
          <label for="email">E-mail</label>
          <div class="input-content">
            <div class="ic-icon">
              <img ngSrc="/assets/icons/email.svg" alt="Ícone de email" height="16" width="20">
            </div>
            <input id="email" type="email" formControlName="email" [maxLength]="150">
          </div>
        </div>
        <div class="input-container">
          <label for="password">Senha</label>
          <div class="input-content">
            <div class="ic-icon">
              <img ngSrc="/assets/icons/password.svg" alt="Ícone de senha" height="17" width="15">
            </div>
            <input id="password" type="password" formControlName="password" [maxLength]="150">
          </div>
        </div>
        <div class="input-container">
          <label for="confirm-password">Confirmar senha</label>
          <div class="input-content">
            <div class="ic-icon">
              <img ngSrc="/assets/icons/password.svg" alt="Ícone de senha" height="17" width="15">
            </div>
            <input id="confirm-password" type="password" formControlName="confirm_password" [maxLength]="150">
          </div>
        </div>
        <app-button [text]="'Cadastrar'" [disabled]="registerForm.invalid"></app-button >
      </div>
      <span class="r-form-footer">Já tem uma conta? <a routerLink="/login">Entrar</a></span>
    </form>
  </div>
</div>
